openapi: "3.1.0"
info:
  title: OpenBrain Knowledge API
  description: Personal and family RAG memory system. Query vault notes, generate quizzes and flashcards, and ingest new content.
  version: "1.0.0"

servers:
  - url: https://openbrain-rouge.vercel.app

paths:
  /openbrain_query:
    post:
      operationId: openbrain_query
      summary: Query the knowledge base
      description: Performs hybrid keyword and vector search over the personal knowledge vault. Returns relevant chunks, tutor guidance rules, and a suggested tutor prompt. Use the rules and tutor_prompt fields to shape your reply to the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: The question or topic to look up in the knowledge base.
                n_results:
                  type: integer
                  description: Maximum number of knowledge chunks to return. Default is 5.
                mode:
                  type: string
                  description: Tutor response mode. One of explain, quiz, flashcards, qa. Default is explain.
                  enum:
                    - explain
                    - quiz
                    - flashcards
                    - qa
                student_attempt:
                  type: string
                  description: Optional student answer attempt. When present, the tutor prompt will respond to this attempt rather than presenting the answer directly.
      responses:
        "200":
          description: Query results with tutor context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                  question:
                    type: string
                  rules:
                    type: array
                    description: Tutor behavior rules to follow when presenting this response. Always respect these rules in your reply.
                    items:
                      type: string
                  tutor_prompt:
                    type: string
                    description: Suggested opening line to use when responding to the user. Use this as your starting point.
                  context_used:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        file:
                          type: string
                        heading:
                          type: string
                        text:
                          type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        score:
                          type: number
                        file:
                          type: string
                        source:
                          type: string
                        heading:
                          type: string
                        source_channel:
                          type: string
                          description: keyword for full-text hits, vector for semantic hits.
                        text:
                          type: string
        "401":
          description: Missing or invalid bearer token.
        "500":
          description: Server or database error.

  /openbrain_generate_quiz:
    post:
      operationId: openbrain_generate_quiz
      summary: Generate quiz questions from vault notes
      description: Retrieves relevant knowledge chunks and returns tutor context formatted for quiz generation. Use tutor_prompt and rules to present the quiz to the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: The topic to generate quiz questions about.
                n_results:
                  type: integer
                  description: Number of knowledge chunks to draw questions from. Default is 5.
      responses:
        "200":
          description: Quiz tutor packet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                  question:
                    type: string
                  rules:
                    type: array
                    items:
                      type: string
                  tutor_prompt:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        score:
                          type: number
                        file:
                          type: string
                        source:
                          type: string
                        heading:
                          type: string
                        text:
                          type: string
        "401":
          description: Missing or invalid bearer token.
        "500":
          description: Server or database error.

  /openbrain_generate_flashcards:
    post:
      operationId: openbrain_generate_flashcards
      summary: Generate flashcards from vault notes
      description: Retrieves relevant knowledge chunks and returns tutor context formatted for flashcard generation. Use tutor_prompt and rules to present cards in front and back format for spaced repetition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: The topic to generate flashcards for.
                n_results:
                  type: integer
                  description: Number of knowledge chunks to draw cards from. Default is 5.
      responses:
        "200":
          description: Flashcard tutor packet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                  question:
                    type: string
                  rules:
                    type: array
                    items:
                      type: string
                  tutor_prompt:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        score:
                          type: number
                        file:
                          type: string
                        source:
                          type: string
                        heading:
                          type: string
                        text:
                          type: string
        "401":
          description: Missing or invalid bearer token.
        "500":
          description: Server or database error.

  /openbrain_plan_ingest:
    post:
      operationId: openbrain_plan_ingest
      summary: Preview an ingest before committing it
      description: >-
        Read-only PREVIEW of an ingest — a "terraform plan" for the vault. Writes nothing. Returns the
        living docs that already exist in scope, what a commit would supersede, and a plan_token to pass
        to openbrain_ingest. Call this FIRST for any note about a system you have written about before:
        you cannot reliably tell an update from a new note without seeing what already exists, and this
        is the only way to see it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  description: The exact content you intend to ingest, verbatim.
                system:
                  type: string
                  description: >-
                    Namespace you believe this belongs to. Supplying it returns an exact list of that
                    system's living docs; omitting it falls back to similarity, which is weaker.
                  enum:
                    - SpectreNet
                    - PMX-01
                    - OpenBrain
                    - FlightSim
                    - MikeMcMahon-Dev
                    - Annie
                component:
                  type: string
                  description: >-
                    Living-doc identity you believe this updates. Supplying it makes the plan report
                    exactly which row would be superseded.
      responses:
        "200":
          description: The plan. Nothing was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_token:
                    type: string
                    description: Pass to openbrain_ingest. Valid 10 minutes, bound to this exact content.
                  candidates:
                    type: array
                    items:
                      type: string
                    description: Every living doc in scope. Either update one, or list them all in acknowledged_not_updating.
                  would_supersede:
                    type: object
                    nullable: true
                    description: The row a commit would retire, or null if this would be a new record.
                  current_state:
                    type: object
                  decision_required:
                    type: string
  /openbrain_ingest:
    post:
      operationId: openbrain_ingest
      summary: Ingest new content into the knowledge base
      description: Adds new content to the personal knowledge vault. Use source_type text to capture a note or learning directly from the conversation. Ingest is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_type
                - source
              properties:
                source_type:
                  type: string
                  description: Type of content being ingested. Use "text" to capture notes from conversation or uploaded files. Use "url" to ingest a webpage — the server fetches and extracts the content. Values "pdf" and "obsidian" are for server-side scripts only.
                source:
                  type: string
                  description: For source_type "text" — the verbatim text content to store (not a filename, variable, or placeholder). For source_type "url" — the full URL to fetch, exactly as given.
                subject:
                  type: string
                  description: Subject or domain label for the ingested content.
                topic:
                  type: string
                  description: Topic tag for the ingested content.
                domain:
                  type: string
                  description: Canonical knowledge domain. Choose the closest existing value; do not invent new domains.
                  enum:
                    - Network
                    - K8s
                    - Security
                    - Study
                    - OpenBrain
                    - Personal
                environment:
                  type: string
                  description: Canonical lifecycle environment. Choose the closest existing value; do not invent new environments.
                  enum:
                    - Production
                    - Lab
                    - Study
                    - Archive
                tags:
                  type: array
                  items:
                    type: string
                  description: >-
                    Optional topical tags drawn from the controlled vocabulary, e.g. IaC, Terraform, Ansible, Bash,
                    Python, K8s, CKA, Network, Security, Architecture, AI, Ops, Lab, Production, OpenBrain, Homelab,
                    SpectreNet, Personal, Family, Annie, Science, Biology, Geometry, Math, Study, Health, Career,
                    Interview. Use existing tags where possible; novel tags are queued for human approval, not auto-applied.
                system:
                  type: string
                  description: Namespace this note belongs to — the ADR-018 supersession pivot. REQUIRED whenever component is set. Choose the closest existing value; do not invent new systems.
                  enum:
                    - SpectreNet
                    - PMX-01
                    - OpenBrain
                    - FlightSim
                    - MikeMcMahon-Dev
                    - Annie
                component:
                  type: string
                  description: Living-doc identity (ADR-008). Set ONLY for a canonical current-state document that should REPLACE its prior version on re-ingest (e.g. dns-current-state) — never for append-only session notes. Requires system. Re-ingesting the same (system, component) retires the old version via a supersession event.
                valid_from:
                  type: string
                  description: ISO-8601 fact-onset (valid-time), e.g. 2026-07-15. Set only when the fact became true BEFORE now (backdating a change you are recording after the fact); otherwise omit — it defaults to ingest time. ADR-018 bitemporality.
                plan_token:
                  type: string
                  description: >-
                    Token from openbrain_plan_ingest, valid 10 minutes and bound to this exact content.
                    Required when plan enforcement is on. Run the plan first.
                acknowledged_not_updating:
                  type: array
                  items:
                    type: string
                  description: >-
                    Every component from the plan's candidates that this note does NOT update. Required
                    in full when writing an append-only note and the plan listed candidates. Naming them
                    records that you saw the list and chose.
                decline_reason:
                  type: string
                  description: >-
                    Why this is a new record rather than an update. Required only when declining a
                    candidate the plan scored as a close match.
      responses:
        "200":
          description: Ingest result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingest_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - accepted
                      - queued
                      - failed
                  message:
                    type: string
                  owner:
                    type: string
        "401":
          description: Missing or invalid bearer token.
        "500":
          description: Server or database error.
