name: secret-scan

# TruffleHog on every commit a PR or a push to main adds. It runs on GitHub, so no local hook path,
# clone location or user account can switch it off. home-lab's TruffleHog pre-commit config never ran
# as a hook (docs/gotchas/shell-git-tooling.md). Unverified findings fail the scan too: the 2026-06-13
# qBittorrent leak got past `--only-verified`. Each run first proves the scanner detects a planted
# canary, so a broken scanner cannot report green.
#
# Same file in every repo; source of truth is home-lab/.github/workflows/secret-scan.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TRUFFLEHOG_VERSION: "3.95.3"
  TRUFFLEHOG_SHA256: "5d836eae522540a32ca0f1a1e00efd4c3153a52462466a4b4008fac1e6c1a548"

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/th.tgz "$url"
          echo "${TRUFFLEHOG_SHA256}  /tmp/th.tgz" | sha256sum -c -
          tar -xzf /tmp/th.tgz -C /tmp trufflehog
          sudo install /tmp/trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Self-test - the scanner must catch a planted canary
        run: |
          set -uo pipefail
          mkdir -p /tmp/canary
          echo "token = trufflehog-canary-$(openssl rand -hex 6)" > /tmp/canary/planted.txt
          # GitHub runs steps under `bash -e`: an unguarded 183 would abort the step before rc is read.
          rc=0
          trufflehog filesystem /tmp/canary --config .github/trufflehog.yaml \
            --results=verified,unknown,unverified --fail --no-update --json > /tmp/canary.json || rc=$?
          if [ "$rc" -ne 183 ] || ! grep -q SelfTestCanary /tmp/canary.json; then
            echo "::error::Self-test FAILED (rc=$rc): TruffleHog did not detect the planted canary. The scanner is broken, so a clean result below would mean nothing."
            exit 1
          fi
          echo "Self-test passed: planted canary detected."

      - name: Scan the commits this change adds
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          base="${PR_BASE:-$PUSH_BEFORE}"
          range_args=()
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            range_args=(--since-commit "$base")
            echo "Scanning commits after $base up to $GITHUB_SHA"
          else
            echo "No base commit (new branch): scanning the full history of $GITHUB_SHA"
          fi
          exclude_args=()
          if [ -f .github/trufflehog-exclude.txt ]; then
            exclude_args=(--exclude-paths .github/trufflehog-exclude.txt)
          fi
          rc=0   # `|| rc=$?` so `bash -e` doesn't end the step before the exit code is examined
          trufflehog git "file://$PWD" "${range_args[@]}" --branch HEAD \
            --config .github/trufflehog.yaml "${exclude_args[@]}" \
            --results=verified,unknown,unverified --fail --no-update || rc=$?
          case "$rc" in
            0)   echo "No secrets found in the scanned commits." ;;
            183) echo "::error::TruffleHog found possible secrets (details above). Remove them from the branch history (a later commit deleting the line is not enough) and rotate anything real. A proven fake can be allowlisted in .github/trufflehog-exclude.txt."
                 exit 1 ;;
            *)   echo "::error::TruffleHog exited $rc (scan error). Failing closed."
                 exit 1 ;;
          esac
